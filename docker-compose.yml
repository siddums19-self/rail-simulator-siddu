services:
  postgres:
    image: postgres:16-alpine
    container_name: railsim-postgres
    environment:
      POSTGRES_DB: railsim
      POSTGRES_USER: railsim_user
      POSTGRES_PASSWORD: railsim_pass
    ports:
      - "5438:5432"
    volumes:
      - railsim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railsim_user -d railsim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  railsim_pgdata:
